<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banco — Demo de reentrancy</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0f1115; color: #e6e6e6; max-width: 900px; margin: 30px auto; padding: 0 16px; }
  h1 { margin-bottom: 4px; }
  .modo { display: inline-block; padding: 4px 12px; border-radius: 6px; font-weight: bold; }
  .vulnerable { background: #7a1f1f; }
  .mitigada { background: #1f6b3a; }
  .card { background: #181b22; border: 1px solid #2a2f3a; border-radius: 10px; padding: 16px; margin: 16px 0; }
  .grande { font-size: 2.2em; font-weight: bold; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #2a2f3a; font-size: 0.95em; }
  td.mono { font-family: monospace; font-size: 0.8em; color: #9aa3b2; }
  button, select, input { padding: 8px 12px; border-radius: 6px; border: 1px solid #3a4050; background: #232733; color: #e6e6e6; cursor: pointer; }
  button:hover { background: #2e3442; }
  button.ataque { background: #b02a2a; border-color: #b02a2a; font-weight: bold; }
  #log { font-family: monospace; font-size: 0.85em; white-space: pre-wrap; max-height: 260px; overflow-y: auto; background: #0b0d10; padding: 10px; border-radius: 6px; }
  .ok { color: #6fdc8c; } .mal { color: #ff6b6b; }
</style>
</head>
<body>
  <h1>Banco descentralizado</h1>
  <span id="modo" class="modo">cargando…</span>

  <div class="card">
    <div>Balance del contrato Banco</div>
    <div class="grande"><span id="balance">—</span> ETH</div>
    <div class="mono" id="direccion"></div>
  </div>

  <div class="card">
    <table>
      <thead><tr><th>Cuenta</th><th>Dirección</th><th>Billetera (ETH)</th><th>Saldo en banco (ETH)</th></tr></thead>
      <tbody id="cuentas"></tbody>
    </table>
  </div>

  <div class="card">
    <select id="cuenta">
      <option value="victima1">victima1</option>
      <option value="victima2">victima2</option>
      <option value="victima3">victima3</option>
      <option value="atacante">atacante</option>
    </select>
    <input id="monto" type="number" value="1" min="0.1" step="0.1" style="width:80px"> ETH
    <button onclick="depositar()">Depositar</button>
    <button onclick="retirar()">Retirar</button>
    <button onclick="cargar()">Actualizar</button>
    <button class="ataque" onclick="atacar()">Lanzar ataque</button>
  </div>

  <div class="card"><div id="log"></div></div>

<script>
  const log = (txt, clase) => {
    const el = document.getElementById("log");
    el.innerHTML = `<div class="${clase || ""}">[${new Date().toLocaleTimeString()}] ${txt}</div>` + el.innerHTML;
  };

  async function api(ruta, body) {
    const r = await fetch(ruta, body ? {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
    } : undefined);
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "Error");
    return data;
  }

  async function cargar() {
    try {
      const e = await api("/estado");
      const m = document.getElementById("modo");
      m.textContent = e.modo === "mitigada" ? "VERSIÓN MITIGADA" : "VERSIÓN VULNERABLE";
      m.className = "modo " + e.modo;
      document.getElementById("balance").textContent = e.balanceBanco;
      document.getElementById("direccion").textContent = "Contrato: " + e.banco;
      document.getElementById("cuentas").innerHTML = Object.entries(e.cuentas).map(([n, c]) =>
        `<tr><td>${n}</td><td class="mono">${c.direccion}</td><td>${Number(c.billetera).toFixed(4)}</td><td>${c.saldoEnBanco}</td></tr>`
      ).join("");
    } catch (err) { log(err.message, "mal"); }
  }

  async function depositar() {
    try {
      const r = await api("/depositar", { cuenta: document.getElementById("cuenta").value, monto: document.getElementById("monto").value });
      log(r.mensaje, "ok");
    } catch (err) { log(err.message, "mal"); }
    cargar();
  }

  async function retirar() {
    try { log((await api("/retirar", { cuenta: document.getElementById("cuenta").value })).mensaje, "ok"); }
    catch (err) { log(err.message, "mal"); }
    cargar();
  }

  async function atacar() {
    log("Desplegando contrato Atacante y lanzando reentrancy…");
    try {
      const r = await api("/atacar", {});
      log(r.mensaje + (r.exito ? ` (robado: ${r.robado} ETH)` : ""), r.exito ? "mal" : "ok");
      if (r.error) log("Revert del contrato: " + r.error);
    } catch (err) { log(err.message, "mal"); }
    cargar();
  }

  cargar();
  setInterval(cargar, 5000);
</script>
</body>
</html>
